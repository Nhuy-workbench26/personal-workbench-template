name: Deploy Như Ý Signal Notes

on:
  push:
    branches: [main]
    paths:
      - "projects/nhu-y-signal-notes/**"
      - ".github/workflows/deploy-nhu-y-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: projects/nhu-y-signal-notes
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
