<script>

const BACKUP_KEY=KEY+'-backup';
const emptyData=()=>({courses:[],assignments:[],exams:[],tasks:[],goals:[],entertainment:[],learning:[],notes:[],reminders:[]});
let storageState='checking',primaryCorruptRaw='';
function normalizeData(saved){if(!saved||typeof saved!=='object'||Array.isArray(saved))throw new Error('Saved workbench data is not an object.');const result={...saved};for(const key of Object.keys(emptyData())){if(saved[key]!==undefined&&!Array.isArray(saved[key]))throw new Error(`Saved ${key} data is not a list.`);if(saved[key]===undefined)result[key]=[]}return result}
function loadData(){try{const raw=localStorage.getItem(KEY);if(raw!==null){try{const data=normalizeData(JSON.parse(raw));storageState='loaded';return data}catch(error){primaryCorruptRaw=raw;const backupRaw=localStorage.getItem(BACKUP_KEY);if(backupRaw!==null){try{const backup=normalizeData(JSON.parse(backupRaw));storageState='recovered';return backup}catch{}}storageState='corrupt';return emptyData()}}const backupRaw=localStorage.getItem(BACKUP_KEY);if(backupRaw!==null){try{const backup=normalizeData(JSON.parse(backupRaw));storageState='recovered';return backup}catch{storageState='corrupt';primaryCorruptRaw=backupRaw;return emptyData()}}storageState='new';return emptyData()}catch{storageState='unavailable';return emptyData()}}
const TEACHER_READ_ONLY=true;let data=normalizeData(JSON.parse(document.getElementById('teacher-snapshot').textContent)),view='home',filter='all',editing=null;
const schemas={

function persist(){if(TEACHER_READ_ONLY)return false;if(storageState==='corrupt'||storageState==='unavailable'){showStorageStatus('Saved data could not be safely read, so this change was not written to browser storage. Export current data and restore a valid backup before continuing.','error');return false}try{if(primaryCorruptRaw&&!localStorage.getItem(KEY+'.recovery'))localStorage.setItem(KEY+'.recovery',primaryCorruptRaw);const previous=localStorage.getItem(KEY),snapshot=JSON.stringify(data);if(previous!==null&&storageState!=='recovered')localStorage.setItem(BACKUP_KEY,previous);localStorage.setItem(KEY,snapshot);if(previous===null||storageState==='recovered')localStorage.setItem(BACKUP_KEY,snapshot);primaryCorruptRaw='';storageState='loaded';showStorageStatus('Saved on this browser.','ok');return true}catch{showStorageStatus('Browser storage is unavailable or full. Export your data to keep a backup.','error');return false}}
function showStorageStatus(message,state){const el=document.getElementById('storage-status');if(!el)return;el.textContent=message;el.dataset.state=state;el.hidden=!message}
function exportData(){if(TEACHER_READ_ONLY)return;const payload={format:'nhu-y-personal-workbench',version:1,exportedAt:new Date().toISOString(),storageKey:KEY,data};if(primaryCorruptRaw)payload.unreadablePreviousData=primaryCorruptRaw;const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`nhu-y-workbench-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.append(link);link.click();link.remove();URL.revokeObjectURL(url);showStorageStatus('Backup exported. Keep the JSON file somewhere safe.','ok')}
function mergeImported(candidate){if(TEACHER_READ_ONLY)return 0;const source=candidate?.data&&typeof candidate.data==='object'?candidate.data:candidate;const collections=Object.keys(emptyData());if(!source||typeof source!=='object'||!collections.some(key=>Array.isArray(source[key])))throw new Error('This file does not contain workbench data.');const incoming=normalizeData(source);let added=0;for(const key of collections){const existing=data[key],ids=new Map(existing.map(item=>[item.id,item]));for(const raw of incoming[key]){if(!raw||typeof raw!=='object'||Array.isArray(raw))continue;const item={...raw};if(item.id&&ids.has(item.id)){if(JSON.stringify(ids.get(item.id))===JSON.stringify(item))continue;item.id=newId()}else if(!item.id)item.id=newId();existing.push(item);ids.set(item.id,item);added++}}return added}
function newId(){return (globalThis.crypto?.randomUUID?.()||`item-${Date.now()}-${Math.random().toString(36).slice(2)}`)}
function esc(value=''){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function pct(list){return list.length?Math.round(list.filter(x=>x.done).length/list.length*100)+'%':'—'}

function formatDateTime(value){if(!value)return '';if(/^\d{4}-\d{2}-\d{2}$/.test(value)){const [y,m,d]=value.split('-').map(Number);return new Intl.DateTimeFormat('en',{dateStyle:'medium'}).format(new Date(y,m-1,d))}const date=new Date(value);if(Number.isNaN(date.getTime()))return '';return new Intl.DateTimeFormat('en',{dateStyle:'medium',timeStyle:'short'}).format(date)}
function asDate(value,endOfDay=false){if(!value)return null;if(/^\d{4}-\d{2}-\d{2}$/.test(value)){const [y,m,d]=value.split('-').map(Number);return new Date(y,m-1,d,endOfDay?23:0,endOfDay?59:0,endOfDay?59:0)}const date=new Date(value);return Number.isNaN(date.getTime())?null:date}
function durationMinutes(item,prefix){const value=Number(item[`${prefix}Duration`]);if(!Number.isFinite(value)||value<=0)return 0;return value*(item[`${prefix}Unit`]==='hours'?60:1)}
function formatDuration(minutes){const total=Math.round(Number(minutes)||0);if(total<=0)return '—';const hours=Math.floor(total/60),mins=total%60;return hours?`${hours} hr${hours===1?'':'s'}${mins?` ${mins} min`:''}`:`${mins} min`}
function taskTimeTotals(){return data.tasks.reduce((sum,item)=>({planned:sum.planned+durationMinutes(item,'planned'),actual:sum.actual+durationMinutes(item,'actual')}),{planned:0,actual:0})}
function todayTaskTime(activityType){return data.tasks.filter(item=>item.done&&item.activityType===activityType&&item.completedAt&&dateKey(new Date(item.completedAt))===localDateKey()).reduce((sum,item)=>sum+durationMinutes(item,'actual'),0)}
function taskTimeSummary(){const totals=taskTimeTotals();return `<div class="time-summary"><article class="card time-total"><span>Planned task time</span><strong>${formatDuration(totals.planned)}</strong></article><article class="card time-total"><span>Actual time spent</span><strong>${formatDuration(totals.actual)}</strong></article></div>`}
function primaryDate(item){return item.scheduledAt||item.due||''}
function itemStatus(item,kind){const value=item.due||item.scheduledAt;if(!value||item.done)return '';const date=asDate(value,/^\d{4}-\d{2}-\d{2}$/.test(value));if(!date)return '';const delta=date.getTime()-Date.now();if(['task','assignment','exam','reminder'].includes(kind)&&delta<0)return 'overdue';if(delta>=0&&delta<=7*86400000)return 'upcoming';return ''}
function cardList(items,kind,empty){if(!items.length)return `<div class="card empty-card">${empty}</div>`;const ordered=[...items].sort((a,b)=>{const av=primaryDate(a)||a.reminderAt,bv=primaryDate(b)||b.reminderAt;return (asDate(av,/^\d{4}-\d{2}-\d{2}$/.test(av||''))?.getTime()??Infinity)-(asDate(bv,/^\d{4}-\d{2}-\d{2}$/.test(bv||''))?.getTime()??Infinity)});return `<div class="data-list">${ordered.map(item=>{const completed=!!item.done,status=itemStatus(item,kind),due=primaryDate(item);return `<article class="card data-card ${status} ${kind==='task'?'has-duration':''}"><div class="record-main"><h3>${esc(item.title)}</h3>${item.detail?`<p>${esc(item.detail)}</p>`:''}<div class="meta">${item.category?`<span class="tag">${esc(item.category)}</span>`:''}${item.course?`<span>${esc(item.course)}</span>`:''}${kind==='goal'?`<span class="progress-wrap"><input aria-label="Goal progress" type="range" min="0" max="100" value="${Math.max(0,Math.min(100,Number(item.progress)||0))}" data-progress="${esc(item.id)}"><span>${Math.max(0,Math.min(100,Number(item.progress)||0))}%</span></span>`:''}</div><div class="record-stamps"><span>Created: ${item.createdAt?esc(formatDateTime(item.createdAt)):'—'}</span><span>Updated: ${item.updatedAt?esc(formatDateTime(item.updatedAt)):'—'}</span></div></div><div class="date-column"><span class="date-caption">Date &amp; time</span><strong>${due?esc(formatDateTime(due)):'—'}</strong>${item.due&&item.scheduledAt?`<span class="reminder-date">Deadline · ${esc(formatDateTime(item.due))}</span>`:''}${item.reminderAt?`<span class="reminder-date">Reminder · ${esc(formatDateTime(item.reminderAt))}</span>`:''}${status==='overdue'?'<span class="status-badge overdue-badge">Overdue</span>':status==='upcoming'?'<span class="status-badge soon-badge">Coming up</span>':''}</div>${kind==='task'?`<div class="duration-column"><span class="date-caption">Duration</span><strong>Planned · ${formatDuration(durationMinutes(item,'planned'))}</strong><span>Actual · ${formatDuration(durationMinutes(item,'actual'))}</span></div>`:''}<div class="item-actions">${kind==='task'||kind==='assignment'?`<button title="${completed?'Mark incomplete':'Mark complete'}" data-action="toggle" data-kind="${kind}" data-id="${esc(item.id)}">${completed?'✓':'○'}</button>`:''}<button title="Edit" data-action="edit" data-kind="${kind}" data-id="${esc(item.id)}">Edit</button><button title="Delete" data-action="delete" data-kind="${kind}" data-id="${esc(item.id)}">Delete</button></div></article>`}).join('')}</div>`}

function datedActivities(){const events=[];const groups=[['tasks','task'],['assignments','assignment'],['exams','exam'],['goals','goal'],['notes','note']];for(const [collection,kind] of groups){for(const item of data[collection]){if(item.due)events.push({title:item.title,when:item.due,kind:kind==='assignment'?'Assignment deadline':kind==='exam'?'Exam':kind==='task'?'Task deadline':kind==='goal'?'Goal date':'Note date',source:kind,id:item.id,done:item.done});if(item.scheduledAt)events.push({title:item.title,when:item.scheduledAt,kind:kind[0].toUpperCase()+kind.slice(1),source:kind,id:item.id,done:item.done});if(item.reminderAt)events.push({title:item.title,when:item.reminderAt,kind:'Reminder',source:kind,id:item.id,done:item.done})}}for(const item of data.reminders){if(item.due)events.push({title:item.title,when:item.due,kind:'Reminder date',source:'reminder',id:item.id});if(item.scheduledAt)events.push({title:item.title,when:item.scheduledAt,kind:'Reminder',source:'reminder',id:item.id})}return events.sort((a,b)=>(asDate(a.when,/^\d{4}-\d{2}-\d{2}$/.test(a.when))?.getTime()??Infinity)-(asDate(b.when,/^\d{4}-\d{2}-\d{2}$/.test(b.when))?.getTime()??Infinity))}
function upcoming(){return datedActivities().filter(x=>{const date=asDate(x.when,/^\d{4}-\d{2}-\d{2}$/.test(x.when));return date&&date.getTime()>=Date.now()&&!(x.done&&['task','assignment'].includes(x.source))}).sort((a,b)=>(asDate(a.when,/^\d{4}-\d{2}-\d{2}$/.test(a.when))?.getTime()??Infinity)-(asDate(b.when,/^\d{4}-\d{2}-\d{2}$/.test(b.when))?.getTime()??Infinity))}
function dateKey(date){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}
function readOnlyList(items,empty){if(!items.length)return `<div class="card empty-card">${empty}</div>`;const ordered=[...items].sort((a,b)=>(asDate(a.due,/^\d{4}-\d{2}-\d{2}$/.test(a.due||''))?.getTime()??Infinity)-(asDate(b.due,/^\d{4}-\d{2}-\d{2}$/.test(b.due||''))?.getTime()??Infinity));return `<div class="data-list">${ordered.map(x=>`<article class="card data-card"><div class="record-main"><h3>${esc(x.title)}</h3><div class="meta">${x.course?`<span>${esc(x.course)}</span>`:''}<span class="tag">${esc(x.kind||'Item')}</span></div></div><div class="date-column"><span class="date-caption">Date &amp; time</span><strong>${esc(formatDateTime(x.due))}</strong></div></article>`).join('')}</div>`}
function home(){let academic=pct(data.assignments),daily=pct(data.tasks),growth=data.goals.length?Math.round(data.goals.reduce((n,g)=>n+(Number(g.progress)||0),0)/data.goals.length)+'%':'—';let soon=upcoming().slice(0,4);return `<section class="section"><div class="section-head"><h2>Today at a glance</h2><p>Your focus areas</p></div><div class="stats"><article class="card stat"><div class="stat-head"><span>Academic Progress</span><span class="stat-icon">◈</span></div><div class="stat-value">${academic}</div><div class="stat-target">Target: 100% · completed assignments</div></article><article class="card stat"><div class="stat-head"><span>Daily Tasks</span><span class="stat-icon">✓</span></div><div class="stat-value">${daily}</div><div class="stat-target">Target: 100% · completed tasks</div></article><article class="card stat"><div class="stat-head"><span>Personal Growth</span><span class="stat-icon">✧</span></div><div class="stat-value">${growth}</div><div class="stat-target">Average progress across goals</div></article><article class="card stat"><div class="stat-head"><span>Entertainment</span><span class="stat-icon">♫</span></div><div class="stat-value">${data.entertainment.length||'—'}</div><div class="stat-target">Saved favorites and activities</div></article></div><div class="dashboard-grid"><article class="card panel"><h3>Your personal focus</h3><p>Business Administration student specializing in Logistics.</p><div class="focus-list"><div class="focus-item"><span class="mini-icon">▤</span>Academic success</div><div class="focus-item"><span class="mini-icon">A</span>English skills</div><div class="focus-item"><span class="mini-icon">✧</span>Personal development</div></div></article><article class="card panel"><h3>Upcoming deadlines &amp; reminders</h3><p>Assignments, exams, and reminders with dates.</p><div class="entries">${soon.length?soon.map(x=>`<div class="entry ${itemStatus({due:x.when,done:x.done},x.source||'reminder')}"><span>${esc(x.title)}</span><span>${esc(formatDateTime(x.when))} · ${x.kind}</span></div>`).join(''):'<span class="empty-state">No dated items yet</span>'}</div></article></div><div class="today-time-summary"><article class="card time-total"><span>Study time today</span><strong>${formatDuration(todayTaskTime('Study'))}</strong><small>Actual time on tasks completed today</small></article><article class="card time-total"><span>Personal activity today</span><strong>${formatDuration(todayTaskTime('Personal activity'))}</strong><small>Actual time on tasks completed today</small></article></div></section><section class="section"><div class="section-head"><h2>Your spaces</h2><p>Plan, unwind, and keep learning</p></div><div class="section-grid"><article class="card module planner"><h3>My Study Planner</h3><p>Organize university courses, assignments, and deadlines.</p><div class="module-list"><div class="module-row"><span>Course Schedule</span><span>${data.courses.length||'—'}</span></div><div class="module-row"><span>Assignments &amp; Deadlines</span><span>${data.assignments.length||'—'}</span></div><div class="module-row"><span>Exam Preparation</span><span>${data.exams.length||'—'}</span></div><button class="back" data-view="planner">Open Study Planner →</button></div></article><article class="card module"><h3>My Entertainment</h3><p>Enjoy favorite activities and relax during free time.</p><div class="module-list">${['Song','Movie','TV series','Leisure activity'].map(c=>`<div class="module-row"><span>${c}</span><span>${data.entertainment.filter(x=>x.category===c).length||'—'}</span></div>`).join('')}<button class="back" data-view="entertainment">Open Entertainment →</button></div></article><article class="card module"><h3>My Learning Corner</h3><p>Develop knowledge and useful skills.</p><div class="module-list">${['English Practice','Logistics Knowledge','Skills Development'].map(c=>`<div class="module-row"><span>${c}</span><span>${data.learning.filter(x=>x.category===c).length||'—'}</span></div>`).join('')}<button class="back" data-view="learning">Open Learning Corner →</button></div></article></div></section><section class="section"><div class="section-head"><h2>Quick Access</h2><p>Your essentials, within reach</p></div><div class="quick-access"><article class="card access"><span class="access-icon">◷</span><div><h3>Upcoming Deadlines</h3><p>Check upcoming assignments, exams, and important deadlines.</p><button class="back" data-view="quick">View deadlines →</button></div></article><article class="card access"><span class="access-icon">✎</span><div><h3>Quick Notes</h3><p>Save important information, ideas, and reminders.</p><button class="back" data-view="notes">Open notes →</button></div></article><article class="card access"><span class="access-icon">☆</span><div><h3>My Favorites</h3><p>Access favorite music, movies, and entertainment activities.</p><button class="back" data-view="entertainment">View favorites →</button></div></article></div></section>`}
function render(){const root=document.getElementById('view-root');if(view==='home'){root.innerHTML=home();return}let html='';if(view==='planner'){html=`<div class="page-head"><div><button class="back" data-back>← Back to Dashboard</button><h2>My Study Planner</h2><p>Organize courses, assignments, and exam schedules.</p></div></div>${section('Courses','Manage your university courses.','course',data.courses,'No courses yet.')}${section('Assignments & Deadlines','Track work and mark completed assignments.','assignment',data.assignments,'No assignments yet.')}${section('Exam Preparation','Keep exam dates and preparation notes together.','exam',data.exams,'No exams scheduled yet.')}`}else if(view==='tasks'){html=`${taskTimeSummary()}${section('Daily Tasks','Plan duration, record actual time spent, and mark completed work. Choose Study or Personal activity to include completed time in the homepage totals.','task',data.tasks,'No daily tasks yet.')}`}else if(view==='goals'){html=section('Personal Goals','Set goals and update their progress at any time.','goal',data.goals,'No personal goals yet.')}else if(view==='entertainment'){html=section('My Entertainment','Save music, movies, TV series, and leisure activities.','entertainment',data.entertainment,'No favorites or activities yet.')}else if(view==='learning'){let tabs=['all','English Practice','Logistics Knowledge','Skills Development'];let list=filter==='all'?data.learning:data.learning.filter(x=>x.category===filter);html=section('My Learning Corner','Organize knowledge and useful skills.','learning',list,'No learning items yet.', '')+`<div class="subnav">${tabs.map(t=>`<button data-filter="${esc(t)}" class="${filter===t?'active':''}">${t==='all'?'All areas':t}</button>`).join('')}</div>`}else if(view==='notes'){html=section('Notes & Ideas','Capture and revisit your personal notes.','note',data.notes,'No notes yet.')}else if(view==='quick'){html=section('Upcoming Deadlines & Reminders','All dated assignments, exams, and reminders.','reminder',data.reminders,'No reminders yet.')+`<div class="page-head"><div><h2>Note Reminders</h2><p>Reminder dates saved with your notes.</p></div><button class="btn" data-view="notes">Manage notes</button></div>${readOnlyList(data.notes.filter(x=>x.reminderAt).map(x=>({...x,due:x.reminderAt,kind:'Note reminder'})).sort((a,b)=>a.due.localeCompare(b.due)),'No note reminders yet.')}<div class="page-head"><div><h2>Assignments &amp; Exams</h2><p>Dates saved in your Study Planner.</p></div></div>${readOnlyList([...data.assignments.map(x=>({...x,due:x.scheduledAt||x.due,kind:'Assignment'})),...data.exams.map(x=>({...x,due:x.scheduledAt||x.due,kind:'Exam'}))].filter(x=>x.due),'No dated assignments or exams yet.')}<div class="page-head"><div><h2>My Favorites</h2><p>Saved entertainment items.</p></div><button class="btn" data-view="entertainment">Manage favorites</button></div>${cardList(data.entertainment,'entertainment','No favorites yet.')}`}
root.innerHTML=html;}
function openEditor(kind,item=null){if(TEACHER_READ_ONLY)return;editing=item?{kind,id:item.id}:null;const dialog=document.getElementById('editor');dialog.dataset.kind=kind;const schema=schemas[kind];document.getElementById('dialog-title').textContent=(item?'Edit ':'Add ')+schema.title;const fields=document.getElementById('form-fields');fields.innerHTML=schema.fields.map(([name,label,type,required,options])=>{let control;if(type==='textarea')control=`<textarea name="${name}">${esc(item?.[name]||'')}</textarea>`;else if(type==='select')control=`<select name="${name}">${!required?`<option value="" ${!item?.[name]?'selected':''}>Choose later</option>`:''}${options.map((o,i)=>`<option value="${o}" ${item?.[name]===o||(!item?.[name]&&required&&i===0)?'selected':''}>${o}</option>`).join('')}</select>`;else control=`<input name="${name}" type="${type}" ${type==='number'?`min="0" step="0.25" ${name==='progress'?'max="100"':''}`:''} value="${esc(item?.[name]??(name==='progress'?0:''))}" ${required?'required':''}>`;return `<div class="field ${type==='textarea'?'wide':''}"><label>${label}${required?' *':''}</label>${control}</div>`}).join('');dialog.showModal()}
function itemCollection(kind){return ({course:'courses',assignment:'assignments',exam:'exams',task:'tasks',goal:'goals',entertainment:'entertainment',learning:'learning',note:'notes',reminder:'reminders'})[kind]}
function handleAction(action,kind,id){if(TEACHER_READ_ONLY)return;const collection=data[itemCollection(kind)],item=collection?.find(x=>x.id===id);if(action==='edit'&&item)openEditor(kind,item);if(action==='delete'&&item&&confirm(`Delete “${item.title}”?`)){data[itemCollection(kind)]=collection.filter(x=>x.id!==id);persist();render()}if(action==='toggle'&&item){item.done=!item.done;item.updatedAt=new Date().toISOString();if(kind==='task')item.completedAt=item.done?item.updatedAt:'';persist();render()}}
document.addEventListener('click',event=>{const nav=event.target.closest('[data-view]');if(nav){setView(nav.dataset.view);return}if(event.target.closest('[data-back]')){setView('home');return}const add=event.target.closest('[data-add]');if(add){if(!TEACHER_READ_ONLY)openEditor(add.dataset.add);return}const act=event.target.closest('[data-action]');if(act){handleAction(act.dataset.action,act.dataset.kind,act.dataset.id);return}const tab=event.target.closest('[data-filter]');if(tab){filter=tab.dataset.filter;render();return}});
document.addEventListener('input',event=>{if(TEACHER_READ_ONLY)return;if(event.target.matches('[data-progress]')){let item=data.goals.find(x=>x.id===event.target.dataset.progress);if(item){item.progress=Number(event.target.value);item.updatedAt=new Date().toISOString();event.target.nextElementSibling.textContent=item.progress+'%';persist()}}});
document.getElementById('editor-form').addEventListener('submit',event=>{event.preventDefault();if(TEACHER_READ_ONLY)return;const form=new FormData(event.currentTarget);const kind=editing?.kind||document.getElementById('editor').dataset.kind;const record=Object.fromEntries(form.entries());record.id=editing?.id||newId();if(kind==='task'||kind==='assignment')record.done=editing?!!data[itemCollection(kind)].find(x=>x.id===editing.id)?.done:false;if(kind==='goal')record.progress=Math.max(0,Math.min(100,Number(record.progress)||0));const collection=data[itemCollection(kind)],index=collection.findIndex(x=>x.id===record.id),previous=index>=0?collection[index]:null,now=new Date().toISOString();if(kind==='task')record.completedAt=previous?.completedAt||'';record.createdAt=previous?(previous.createdAt||''):now;record.updatedAt=now;for(const field of ['scheduledAt','reminderAt'])if(field in record)record[field]=record[field]||'';if(index>=0)collection[index]={...previous,...record};else collection.unshift(record);persist();document.getElementById('editor').close();render()});
document.getElementById('dialog-close').onclick=()=>document.getElementById('editor').close();document.getElementById('dialog-cancel').onclick=()=>document.getElementById('editor').close();
document.querySelectorAll('[data-quick]').forEach(button=>button.addEventListener('click',()=>{if(TEACHER_READ_ONLY)return;const kind=button.dataset.quick,text=document.getElementById('quick-input').value.trim();if(!text){document.getElementById('quick-input').focus();document.getElementById('quick-input').placeholder=button.textContent.trim()+': add details here…';return}if(kind==='task')openEditor('task',{title:text});else if(kind==='note')openEditor('note',{title:text});else openEditor('reminder',{title:text});document.getElementById('quick-input').value=''}));
document.getElementById('export-data').onclick=exportData;document.getElementById('import-data').onclick=()=>document.getElementById('import-file').click();document.getElementById('import-file').addEventListener('change',async event=>{if(TEACHER_READ_ONLY)return;const file=event.target.files?.[0];if(!file)return;try{const imported=JSON.parse(await file.text()),added=mergeImported(imported);if(storageState==='corrupt'&&added>0)storageState='recovered';if(added===0){showStorageStatus('No new entries were imported. Existing browser data was left untouched.','ok')}else if(persist()){showStorageStatus(`${added} item${added===1?'':'s'} merged. Existing items were preserved.`,'ok');render()}}catch{showStorageStatus('Import failed: choose a valid Personal Workbench JSON backup. Existing data was left untouched.','error')}finally{event.target.value=''}});
document.querySelector('.avatar').onclick=()=>alert('Personal Workbench for Như Ý');document.getElementById('search-button').onclick=()=>{const q=prompt('Search your saved items');if(q){const term=q.toLowerCase();const match=Object.values(data).flatMap(items=>items.filter(item=>JSON.stringify(item).toLowerCase().includes(term)));alert(match.length?match.map(x=>x.title).join('\n'):'No matching saved items.')}};document.getElementById('reminders-button').onclick=()=>setView('quick');
const today=new Date();document.getElementById('date-label').textContent=new Intl.DateTimeFormat('en',{weekday:'long',month:'long',day:'numeric'}).format(today);showStorageStatus('Read-only teacher preview · Backup snapshot from November 5, 2026. This copy does not save changes.','ok');render();
</script></body></html>
